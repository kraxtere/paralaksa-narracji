# Raport dzienny (SPEC §13): codziennie 05:00 UTC, `plx run-daily`, commit raportu do reports/.
# Baza SQLite (data/, poza gitem) przechodzi między uruchomieniami przez cache GitHub Actions;
# kopia zapasowa jako artefakt (cache znika po 7 dniach bez użycia).
# Wymagane sekrety repozytorium: DEEPSEEK_API_KEY (ekstrakcja), ANTHROPIC_API_KEY (gdy model Claude w settings.yaml).
name: daily

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  run-daily:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalacja
        run: pip install -e .

      # Klucz z run_id nigdy nie trafia wprost; restore-keys bierze najnowszy zapis z prefiksem "db-".
      - name: Przywróć bazę
        uses: actions/cache/restore@v4
        with:
          path: data/paralaksa.db
          key: db-${{ github.run_id }}
          restore-keys: db-

      - name: plx run-daily
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: plx -v run-daily

      - name: Zapisz bazę
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/paralaksa.db
          key: db-${{ github.run_id }}

      - name: Kopia bazy (artefakt)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paralaksa-db
          path: data/paralaksa.db
          retention-days: 30
          if-no-files-found: ignore

      - name: Commit raportu
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/
          if git diff --cached --quiet; then
            echo "Brak zmian w reports/."
          else
            git commit -m "Raport dzienny $(date -u +%F)"
            git push
          fi
