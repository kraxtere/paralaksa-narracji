name: daily
on:
  schedule:
    # 10:30 UTC; Actions tylko pobiera artykuły i robi backup bazy (ekstrakcja lokalnie, docs/OPERATIONS.md)
    - cron: "30 10 * * *"
  workflow_dispatch:
    inputs:
      initialize_empty:
        description: "Świadomie utwórz pierwszą bazę (wyłącznie gdy brak backupu)."
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: daily
  cancel-in-progress: false
jobs:
  # Spóźniony cron po ręcznym przebiegu tego dnia (UTC) kończy się bez pracy; ręczne wywołanie liczy zawsze.
  check:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          day=$(date -u +%F)
          if [ "${{ github.event_name }}" = schedule ] && [ -f "reports/$day.status.json" ]; then
            echo "::notice::Przebieg $day już był (ręczny); harmonogram pominięty."
            echo run=false >> "$GITHUB_OUTPUT"
          else
            echo run=true >> "$GITHUB_OUTPUT"
          fi
  run-daily:
    needs: check
    if: needs.check.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      DB_BACKUP_KEY: ${{ secrets.DB_BACKUP_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalacja
        run: pip install -e .
      - name: Sprawdź konfigurację backupu
        run: test -n "$DB_BACKUP_KEY" || { echo '::error::Brak sekretu DB_BACKUP_KEY'; exit 1; }
      - name: Przywróć zaszyfrowany cache
        uses: actions/cache/restore@v4
        with:
          path: state-cache/
          key: encrypted-db-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: encrypted-db-
      - name: Przywróć trwały backup i sprawdź SQLite
        env:
          INITIALIZE_EMPTY: ${{ inputs.initialize_empty }}
        run: |
          mkdir -p data state-cache
          if gh release view database-backup >/dev/null 2>&1; then
            # Release jest autorytatywny; cache może być starszy od ostatniego przebiegu.
            gh release download database-backup -p latest.db.enc -p latest.db.enc.sha256 -D state-cache --clobber
          elif [ ! -f state-cache/latest.db.enc ]; then
            if [ "$INITIALIZE_EMPTY" != 'true' ]; then
              echo '::error::Brak backupu/cache. Przywróć bazę zgodnie z docs/OPERATIONS.md.'
              exit 1
            fi
            echo '::warning::Jawna inicjalizacja pierwszej bazy; brak wcześniejszej historii.'
            plx init-db
          else
            echo '::warning::Release niedostępny; odzyskiwanie z cache. Sprawdź ciągłość historii.'
          fi
          if [ -f state-cache/latest.db.enc ]; then
            (cd state-cache && sha256sum --check latest.db.enc.sha256)
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in state-cache/latest.db.enc -out data/restore.db -pass env:DB_BACKUP_KEY
            python scripts/db_state.py data/restore.db
            mv data/restore.db data/paralaksa.db
          fi
          python scripts/db_state.py data/paralaksa.db
      - name: plx ingest (ekstrakcja lokalnie przez Codex)
        id: pipeline
        run: plx ingest
      - name: Snapshot i szyfrowanie
        id: snapshot
        if: always() && (steps.pipeline.outcome == 'success' || steps.pipeline.outcome == 'failure')
        run: |
          python scripts/db_state.py data/paralaksa.db --snapshot data/snapshot.db
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 -in data/snapshot.db -out state-cache/latest.db.enc -pass env:DB_BACKUP_KEY
          (cd state-cache && sha256sum latest.db.enc > latest.db.enc.sha256)
      - name: Trwały backup (Release, bez automatycznego wygasania)
        if: always() && steps.snapshot.outcome == 'success'
        run: |
          gh release view database-backup >/dev/null 2>&1 || gh release create database-backup --title 'Encrypted database backups' --notes 'Encrypted SQLite snapshots. Recovery: docs/OPERATIONS.md.'
          cp state-cache/latest.db.enc "state-cache/db-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.enc"
          gh release upload database-backup state-cache/latest.db.enc state-cache/latest.db.enc.sha256 "state-cache/db-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.enc" --clobber
      - name: Zapisz zaszyfrowany cache
        if: always() && steps.snapshot.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: state-cache/
          key: encrypted-db-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Kopia awaryjna (wyłącznie zaszyfrowana)
        if: always() && steps.snapshot.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: paralaksa-encrypted-db
          path: state-cache/latest.db.enc*
          retention-days: 30
          if-no-files-found: error
      - name: Raport statusu
        if: always()
        run: |
          echo "Pipeline: ${{ steps.pipeline.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          for file in reports/*.status.json; do
            if [ -f "$file" ]; then
              cat "$file" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
      - name: Commit statusu dnia (również oznaczonego jako niepełny)
        if: always() && (steps.pipeline.outcome == 'success' || steps.pipeline.outcome == 'failure')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/
          if ! git diff --cached --quiet; then
            git commit -m "Status dnia $(date -u +%F)"
            git pull --rebase
            git push
          fi
