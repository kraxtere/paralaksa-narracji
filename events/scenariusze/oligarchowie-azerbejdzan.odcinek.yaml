# Roboczy odcinek (pionowy, ok. 60 s). Karta: events/2026-09-22-oligarchowie-azerbejdzan.md
# Render: .venv\Scripts\python scripts\odcinek.py events\scenariusze\oligarchowie-azerbejdzan.odcinek.yaml
# Wynik (poza gitem): data/odcinki/<id>/ — plansze PNG, odcinek.mp4, napisy.srt, lektor.txt
#
# Ujęcia: czas w sekundach; `lektor` to tekst przyszłego głosu (na razie napis na dole);
# `zegar` to chwila na osi czasu (czas polski, tylko godziny z karty); bloki: tytul, tekst, naglowek, dwie_polowy, stopka.
# Nagłówki dosłownie z karty (relacja rX), maks. 15 słów; tłumaczenia robocze.
# Kolejność ujęć idzie za osią czasu (znacznik nie cofa się).
#
# Przed publikacją:
# - człowiek otwiera r1, r3, r4, r5, r6, r7, r8, r10 i wpisuje `sprawdzil` (dziś większość z RSS / wyszukiwarki);
# - godzina r7 (UP, 08:09) jest z RSS: potwierdzić, bo ujęcie 7 stoi na tym, że UP pisała przed dekretem (09:19);
# - kopie r4, r5, r7, r8, r10 (archiwum ich nie przyjęło): archive.today albo zrzut z datą.

id: 2026-09-22-oligarchowie-azerbejdzan
