# Render Blueprint: strona wewnętrzna pod hasłem. Login, hasło i token podajesz w Renderze, nie w repo.
services:
  - type: web
    name: paralaksa-strona
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    envVars:
      - key: SITE_USER
        sync: false
      - key: SITE_PASSWORD
        sync: false
      # konta innych osób i czas na stronie: token fine-grained z dostępem tylko do repo z ACTIVITY_REPO (Contents: zapis)
      - key: ACTIVITY_TOKEN
        sync: false
      - key: ACTIVITY_REPO
        value: kraxtere/paralaksa-aktywnosc
      # powiadomienia o nowym wydaniu (Web Push): klucz prywatny VAPID z lokalnego .env; bez niego strona działa bez powiadomień
      - key: VAPID_PRIVATE_KEY
        sync: false
